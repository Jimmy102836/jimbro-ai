<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomoAI图片库</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            color: #333;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .image-item {
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .image-item img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .image-title {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>DomoAI图片库</h1>
    
    <h2>特性图片</h2>
    <div class="image-grid">
        <div class="image-item">
            <img src="images/features/image-to-video.png" alt="图像转视频">
            <div class="image-title">图像转视频</div>
        </div>
        <div class="image-item">
            <img src="images/features/text-to-image.png" alt="文本转图像">
            <div class="image-title">文本转图像</div>
        </div>
        <div class="image-item">
            <img src="images/features/character-animation.png" alt="角色动画">
            <div class="image-title">角色动画</div>
        </div>
        <div class="image-item">
            <img src="images/features/video-generator.png" alt="视频生成器">
            <div class="image-title">视频生成器</div>
        </div>
    </div>
    
    <h2>风格图片</h2>
    <div class="image-grid">
        <div class="image-item">
            <img src="images/features/monet.png" alt="莫奈风格">
            <div class="image-title">莫奈风格</div>
        </div>
        <div class="image-item">
            <img src="images/features/illustration.png" alt="插画风格">
            <div class="image-title">插画风格</div>
        </div>
        <div class="image-item">
            <img src="images/features/movie.png" alt="电影风格">
            <div class="image-title">电影风格</div>
        </div>
        <div class="image-item">
            <img src="images/features/cyberpunk.png" alt="赛博朋克">
            <div class="image-title">赛博朋克</div>
        </div>
        <div class="image-item">
            <img src="images/features/marble.png" alt="大理石">
            <div class="image-title">大理石</div>
        </div>
    </div>
    
    <h2>团队成员</h2>
    <div class="image-grid">
        <div class="image-item">
            <img src="images/team/team-member-1.jpg" alt="团队成员1">
            <div class="image-title">首席执行官</div>
        </div>
        <div class="image-item">
            <img src="images/team/team-member-2.jpg" alt="团队成员2">
            <div class="image-title">首席技术官</div>
        </div>
        <div class="image-item">
            <img src="images/team/team-member-3.jpg" alt="团队成员3">
            <div class="image-title">产品经理</div>
        </div>
    </div>
    
    <h2>用户评价</h2>
    <div class="image-grid">
        <div class="image-item">
            <img src="images/testimonials/avatar1.jpg" alt="用户头像1">
            <div class="image-title">张先生</div>
        </div>
        <div class="image-item">
            <img src="images/testimonials/avatar2.jpg" alt="用户头像2">
            <div class="image-title">李女士</div>
        </div>
        <div class="image-item">
            <img src="images/testimonials/avatar3.jpg" alt="用户头像3">
            <div class="image-title">王先生</div>
        </div>
    </div>
</body>
</html>
